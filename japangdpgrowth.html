<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Real GDP Growth</title>
</head>
<body style="background-color: #f8fafc; font-family: -apple-system, sans-serif; padding: 20px; margin: 0;">
    <div style="max-width: 800px; margin: 40px auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
        <h2 style="color: #0f172a; margin-top: 0; margin-bottom: 20px;">Japan: Real GDP Annual Growth Rate (%)</h2>
        <div style="height: 400px;"><canvas id="japanChart"></canvas></div>
        <div id="return-home-button" style="display: flex; justify-content: center; margin-top: 28px;">
            <a class="return-home-button" href="index.html" 
            style="display: inline-block; padding: 12px 26px; border-radius: 999px; background: #0f766e; color: #ffffff; text-decoration: none; font-weight: 600; letter-spacing: 0.01em; box-shadow: 0 5px 12px rgba(15, 118, 110, 0.24); transition: background-color 0.2s ease, transform 0.2s ease;" onmouseover="this.style.backgroundColor='#115e59'; this.style.transform='translateY(-1px)'" onmouseout="this.style.backgroundColor='#0f766e'; this.style.transform='translateY(0)'">Return to Home</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const years = [
            1960, 1961, 1962, 1963, 1964, 1965, 1966, 1967, 1968, 1969, 1970,
            1971, 1972, 1973, 1974, 1975, 1976, 1977, 1978, 1979, 1980,
            1981, 1982, 1983, 1984, 1985, 1986, 1987, 1988, 1989, 1990,
            1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000,
            2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010,
            2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020,
            2021, 2022, 2023, 2024, 2025, 2026
        ];
        const japanData = [13.1, 12.0, 8.9, 8.5, 11.7, 5.8, 10.6, 11.1, 12.9, 12.5, 10.3, 4.4, 8.4, 8.0, -1.2, 3.1, 4.0, 4.4, 5.3, 5.5, 2.8, 4.2, 3.3, 3.5, 4.5, 5.2, 3.3, 4.7, 6.8, 4.9, 4.9, 3.4, 0.8, -0.5, 0.9, 2.6, 3.1, 1.1, -1.1, -0.3, 2.8, 0.4, 0.0, 1.5, 2.2, 1.8, 1.4, 1.5, -1.2, -5.7, 4.1, -0.1, 1.4, 2.0, 0.3, 1.6, 0.8, 1.7, 0.6, -0.4, -4.3, 2.2, 0.9, 1.90, 0.30, 0.90, 0.70];
        new Chart(document.getElementById('japanChart'), {
            type: 'line',
            data: { labels: years, datasets: [{ label: 'Japan Growth Rate', data: japanData, borderColor: '#7c3aed', backgroundColor: 'transparent', borderWidth: 3, pointRadius: 0, pointHoverRadius: 6 }] },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                interaction: { mode: 'index', intersect: false },
                plugins: { tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.9)', padding: 12, callbacks: { label: ctx => ' Growth: ' + (ctx.parsed.y > 0 ? '+' : '') + ctx.parsed.y.toFixed(2) + '%' } } }, 
                scales: { y: { min: -12, max: 16, ticks: { callback: v => v + '%' }, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } } 
            }
        });
    </script>
</body>
</html>
