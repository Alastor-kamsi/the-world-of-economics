<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belize Population (Billions)</title>
</head>
<body style="background-color: #f8fafc; font-family: -apple-system, sans-serif; padding: 20px; margin: 0;">
    <div style="max-width: 800px; margin: 40px auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
        <h2 style="color: #0f172a; margin-top: 0; margin-bottom: 20px;">Belize: Population (Billions) (1981-2026)</h2>
        <div style="height: 400px;"><canvas id="populationChart"></canvas></div>
        <div id="return-home-button" style="display: flex; justify-content: center; margin-top: 28px;">
            <a class="return-home-button" href="../belize.html" style="display: inline-block; padding: 12px 26px; border-radius: 999px; background: #0f766e; color: #ffffff; text-decoration: none; font-weight: 600; letter-spacing: 0.01em; box-shadow: 0 5px 12px rgba(15, 118, 110, 0.24); transition: background-color 0.2s ease, transform 0.2s ease;" onmouseover="this.style.backgroundColor='#115e59'; this.style.transform='translateY(-1px)'" onmouseout="this.style.backgroundColor='#0f766e'; this.style.transform='translateY(0)'">Return to Belize Home</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7"></script>
    <script>
        // Source: IMF World Economic Outlook (October 2026) via IMF DataMapper.
        // Values are shown for 1981-2026; missing observations remain blank.
        const years = [1981,1982,1983,1984,1985,1986,1987,1988,1989,1990,1991,1992,1993,1994,1995,1996,1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026];
        const values = [0.00015,0.000153,0.000157,0.000162,0.000166,0.000171,0.000176,0.000179,0.000184,0.000189,0.000194,0.000199,0.000205,0.000211,0.000217,0.000222,0.00023,0.000239,0.000243,0.00025,0.000256,0.000263,0.000269,0.000276,0.000284,0.000291,0.000299,0.000307,0.000315,0.000322,0.000328,0.000334,0.000342,0.000349,0.000357,0.000364,0.000371,0.000379,0.000386,0.000393,0.000399,0.000397,0.000404,0.000411,0.000418,0.000426];
        if (!values.every(value => value === null)) {
            const maxValue = Math.max(...values.filter(value => value !== null));
            const displayUnit = maxValue < 0.001
                ? { factor: 1000000, suffix: "K", title: "Thousands", tooltip: "thousand" }
                : maxValue < 1
                    ? { factor: 1000, suffix: "M", title: "Millions", tooltip: "million" }
                    : { factor: 1, suffix: "B", title: "Billions", tooltip: "billion" };
            const displayValues = values.map(value => value === null ? null : value * displayUnit.factor);
            const formatMagnitude = value => new Intl.NumberFormat("en-US", { maximumSignificantDigits: 3 }).format(value);
            const formatAxis = value => formatMagnitude(value) + displayUnit.suffix;
            document.title = document.title.replace("(Billions)", "(" + displayUnit.title + ")");
            document.querySelector("h2").textContent = document.querySelector("h2").textContent.replace("(Billions)", "(" + displayUnit.title + ")");
            new Chart(document.getElementById('populationChart'), {
                type: 'line',
                data: { labels: years, datasets: [{
                    label: "Population", data: displayValues, borderColor: "#2052c5",
                    backgroundColor: 'transparent', borderWidth: 3, pointRadius: 0, pointHoverRadius: 6, tension: 0.3
                }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.9)', padding: 12, callbacks: { label: context => " " + "Belize" + " Population: " + formatMagnitude(context.parsed.y) + " " + displayUnit.tooltip } }
                    },
                    scales: {
                        y: { ticks: { callback: value => formatAxis(value) }, grid: { color: '#f1f5f9' } },
                        x: { grid: { display: false }, ticks: { maxRotation: 45, minRotation: 45 } }
                    }
                }
            });
        } else {
            const canvas = document.getElementById('populationChart');
            const empty = document.createElement('p');
            empty.textContent = 'No IMF data is available for this country and indicator.';
            empty.style.cssText = 'color: #64748b; font-size: 16px; padding: 80px 20px; text-align: center;';
            canvas.replaceWith(empty);
        }
    </script>
</body>
</html>
