<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iraq Nominal GDP (Trillion USD)</title>
</head>
<body style="background-color: #f8fafc; font-family: -apple-system, sans-serif; padding: 20px; margin: 0;">
    <div style="max-width: 800px; margin: 40px auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
        <h2 style="color: #0f172a; margin-top: 0; margin-bottom: 20px;">Iraq: Nominal GDP (Trillion USD) (2000-2026)</h2>
        <div style="height: 400px;"><canvas id="gdpChart"></canvas></div>
        <div id="return-home-button" style="display: flex; justify-content: center; margin-top: 28px;">
            <a class="return-home-button" href="../iraq.html" style="display: inline-block; padding: 12px 26px; border-radius: 999px; background: #0f766e; color: #ffffff; text-decoration: none; font-weight: 600; letter-spacing: 0.01em; box-shadow: 0 5px 12px rgba(15, 118, 110, 0.24); transition: background-color 0.2s ease, transform 0.2s ease;" onmouseover="this.style.backgroundColor='#115e59'; this.style.transform='translateY(-1px)'" onmouseout="this.style.backgroundColor='#0f766e'; this.style.transform='translateY(0)'">Return to Iraq Home</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7"></script>
    <script>
        // Source: IMF World Economic Outlook (October 2026) via IMF DataMapper.
        // Values are shown for 2000-2026; missing observations remain blank.
        const years = [2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026];
        const values = [0.025984,0.021113,0.021063,0.0158,0.036642,0.050065,0.065144,0.088833,0.131614,0.11166,0.138517,0.18575,0.218032,0.234638,0.234651,0.177634,0.168429,0.190048,0.230189,0.236682,0.182576,0.210753,0.288059,0.270799,0.283703,0.264167,0.245234];
        if (!values.every(value => value === null)) {
            const maxValue = Math.max(...values.filter(value => value !== null));
            const displayUnit = maxValue < 0.001
                ? { factor: 1000000, suffix: "M", title: "Million USD", tooltip: "million USD" }
                : maxValue < 1
                    ? { factor: 1000, suffix: "B", title: "Billion USD", tooltip: "billion USD" }
                    : { factor: 1, suffix: "T", title: "Trillion USD", tooltip: "trillion USD" };
            const displayValues = values.map(value => value === null ? null : value * displayUnit.factor);
            const formatMagnitude = value => new Intl.NumberFormat("en-US", { maximumSignificantDigits: 3 }).format(value);
            const formatAxis = value => "$" + formatMagnitude(value) + displayUnit.suffix;
            document.title = document.title.replace("(Trillion USD)", "(" + displayUnit.title + ")");
            document.querySelector("h2").textContent = document.querySelector("h2").textContent.replace("(Trillion USD)", "(" + displayUnit.title + ")");
            new Chart(document.getElementById('gdpChart'), {
                type: 'line',
                data: { labels: years, datasets: [{
                    label: "GDP", data: displayValues, borderColor: "#c5a420",
                    backgroundColor: 'transparent', borderWidth: 3, pointRadius: 0, pointHoverRadius: 6, tension: 0.3
                }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.9)', padding: 12, callbacks: { label: context => " " + "Iraq" + " GDP: $" + formatMagnitude(context.parsed.y) + " " + displayUnit.tooltip } }
                    },
                    scales: {
                        y: { ticks: { callback: value => formatAxis(value) }, grid: { color: '#f1f5f9' } },
                        x: { grid: { display: false }, ticks: { maxRotation: 45, minRotation: 45 } }
                    }
                }
            });
        } else {
            const canvas = document.getElementById('gdpChart');
            const empty = document.createElement('p');
            empty.textContent = 'No IMF data is available for this country and indicator.';
            empty.style.cssText = 'color: #64748b; font-size: 16px; padding: 80px 20px; text-align: center;';
            canvas.replaceWith(empty);
        }
    </script>
</body>
</html>
