<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuwait GDP</title>
</head>

<body style="background-color: #f8fafc; font-family: -apple-system, sans-serif; padding: 20px; margin: 0;">

    <div style="
        max-width: 800px;
        margin: 40px auto;
        background: #ffffff;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    ">

        <h2 style="
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 20px;
        ">
            Kuwait: Nominal GDP (Billion USD)
        </h2>

        <div style="height: 400px;">
            <canvas id="kuwaitGDPChart"></canvas>
        </div>

        <div id="return-home-button" style="display: flex; justify-content: center; margin-top: 28px;">
            <a class="return-home-button" href="index.html" 
            style="display: inline-block; padding: 12px 26px; border-radius: 999px; background: #0f766e; color: #ffffff; text-decoration: none; font-weight: 600; letter-spacing: 0.01em; box-shadow: 0 5px 12px rgba(15, 118, 110, 0.24); transition: background-color 0.2s ease, transform 0.2s ease;" onmouseover="this.style.backgroundColor='#115e59'; this.style.transform='translateY(-1px)'" onmouseout="this.style.backgroundColor='#0f766e'; this.style.transform='translateY(0)'">Return to Home</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // Kuwait became independent on 19 June 1961,
        // so the chart starts from the independence year.

        const years = [
            1961, 1962, 1963, 1964, 1965, 1966, 1967, 1968, 1969, 1970,
            1971, 1972, 1973, 1974, 1975, 1976, 1977, 1978, 1979, 1980,
            1981, 1982, 1983, 1984, 1985, 1986, 1987, 1988, 1989, 1990,
            1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000,
            2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010,
            2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020,
            2021, 2022, 2023, 2024, 2025, 2026
        ];

        const kuwaitGdpBillionsUSD = [
            0.00, 1.83, 1.95, 2.14, 2.18, 2.38, 2.42, 2.56, 2.77, 3.04,
            3.73, 4.41, 5.48, 11.97, 11.60, 13.06, 13.79, 15.39, 24.31, 28.18,
            25.25, 21.41, 20.37, 21.67, 19.34, 17.18, 19.24, 19.29, 23.36, 18.29,
            10.79, 19.72, 23.97, 24.81, 27.16, 31.50, 30.34, 25.31, 29.98, 37.72,
            34.90, 38.14, 47.85, 59.44, 80.80, 101.56, 114.73, 147.41, 105.99, 115.42,
            154.08, 174.06, 174.19, 162.68, 114.58, 109.39, 120.69, 138.18, 134.61, 105.95,
            136.64, 183.50, 165.46, 160.90, 157.21, 172.92
        ];

        new Chart(document.getElementById('kuwaitGDPChart'), {

            type: 'line',

            data: {
                labels: years,

                datasets: [{
                    label: 'Kuwait GDP',
                    data: kuwaitGdpBillionsUSD,

                    // Kuwait-inspired green
                    borderColor: '#16a34a',
                    backgroundColor: 'transparent',

                    borderWidth: 3,

                    // Clean line like the Japan chart
                    pointRadius: 0,
                    pointHoverRadius: 6,

                    tension: 0.3
                }]
            },

            options: {
                responsive: true,
                maintainAspectRatio: false,

                interaction: {
                    mode: 'index',
                    intersect: false
                },

                plugins: {

                    legend: {
                        display: false
                    },

                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.9)',
                        padding: 12,

                        callbacks: {
                            label: function (context) {
                                return ' GDP: $' +
                                    context.parsed.y.toFixed(2) +
                                    ' billion';
                            }
                        }
                    }
                },

                scales: {

                    y: {
                        min: 0,
                        max: 200,

                        ticks: {
                            callback: function (value) {
                                return '$' + value + 'B';
                            }
                        },

                        grid: {
                            color: '#f1f5f9'
                        }
                    },

                    x: {

                        grid: {
                            display: false
                        },

                        ticks: {
                            maxRotation: 45,
                            minRotation: 45
                        }
                    }
                }
            }
        });
    </script>

</body>

</html>
