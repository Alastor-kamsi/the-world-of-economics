<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudan Inflation Rate (%)</title>
</head>
<body style="background-color: #f8fafc; font-family: -apple-system, sans-serif; padding: 20px; margin: 0;">
    <div style="max-width: 800px; margin: 40px auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
        <h2 style="color: #0f172a; margin-top: 0; margin-bottom: 20px;">Sudan: Inflation Rate (%) (1980-2026)</h2>
        <div style="height: 400px;"><canvas id="inflationChart"></canvas></div>
        <div id="return-home-button" style="display: flex; justify-content: center; margin-top: 28px;">
            <a class="return-home-button" href="../sudan.html" style="display: inline-block; padding: 12px 26px; border-radius: 999px; background: #0f766e; color: #ffffff; text-decoration: none; font-weight: 600; letter-spacing: 0.01em; box-shadow: 0 5px 12px rgba(15, 118, 110, 0.24); transition: background-color 0.2s ease, transform 0.2s ease;" onmouseover="this.style.backgroundColor='#115e59'; this.style.transform='translateY(-1px)'" onmouseout="this.style.backgroundColor='#0f766e'; this.style.transform='translateY(0)'">Return to Sudan Home</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7"></script>
    <script>
        // Source: IMF World Economic Outlook (October 2026) via IMF DataMapper.
        // Values are shown for 1980-2026; missing observations remain blank.
        const years = [1980,1981,1982,1983,1984,1985,1986,1987,1988,1989,1990,1991,1992,1993,1994,1995,1996,1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026];
        const values = [26.5,24,26.6,30.6,33.7,45.6,60,26.5,62.9,65.3,-0.9,123.6,117.6,101.3,115.5,68.4,86.8,47.2,24.6,17.2,7.1,1.9,22.2,6.5,9.7,8.5,7.2,14.8,14.3,11.3,13,18.1,35.6,36.5,36.9,16.9,17.8,32.4,63.3,51,163.3,359.1,138.8,66.6,176.9,99.9,41.3];
        if (!values.every(value => value === null)) {
            new Chart(document.getElementById('inflationChart'), {
                type: 'line',
                data: { labels: years, datasets: [{
                    label: "Inflation Rate", data: values, borderColor: "#20a2c5",
                    backgroundColor: 'transparent', borderWidth: 3, pointRadius: 0, pointHoverRadius: 6, tension: 0.3
                }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.9)', padding: 12, callbacks: { label: context => " " + "Sudan" + " Inflation Rate: " + context.parsed.y.toFixed(1) + "%" } }
                    },
                    scales: {
                        y: { ticks: { callback: value => value.toFixed(1) + '%' }, grid: { color: '#f1f5f9' } },
                        x: { grid: { display: false }, ticks: { maxRotation: 45, minRotation: 45 } }
                    }
                }
            });
        } else {
            const canvas = document.getElementById('inflationChart');
            const empty = document.createElement('p');
            empty.textContent = 'No IMF data is available for this country and indicator.';
            empty.style.cssText = 'color: #64748b; font-size: 16px; padding: 80px 20px; text-align: center;';
            canvas.replaceWith(empty);
        }
    </script>
</body>
</html>
