<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Democratic Republic of the Congo Population (Billions)</title>
</head>
<body style="background-color: #f8fafc; font-family: -apple-system, sans-serif; padding: 20px; margin: 0;">
    <div style="max-width: 800px; margin: 40px auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
        <h2 style="color: #0f172a; margin-top: 0; margin-bottom: 20px;">Democratic Republic of the Congo: Population (Billions) (1980-2026)</h2>
        <div style="height: 400px;"><canvas id="populationChart"></canvas></div>
        <div id="return-home-button" style="display: flex; justify-content: center; margin-top: 28px;">
            <a class="return-home-button" href="../democraticrepublicofthecongo.html" style="display: inline-block; padding: 12px 26px; border-radius: 999px; background: #0f766e; color: #ffffff; text-decoration: none; font-weight: 600; letter-spacing: 0.01em; box-shadow: 0 5px 12px rgba(15, 118, 110, 0.24); transition: background-color 0.2s ease, transform 0.2s ease;" onmouseover="this.style.backgroundColor='#115e59'; this.style.transform='translateY(-1px)'" onmouseout="this.style.backgroundColor='#0f766e'; this.style.transform='translateY(0)'">Return to Democratic Republic of the Congo Home</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7"></script>
    <script>
        // Source: IMF World Economic Outlook (October 2026) via IMF DataMapper.
        // Values are shown for 1980-2026; missing observations remain blank.
        const years = [1980,1981,1982,1983,1984,1985,1986,1987,1988,1989,1990,1991,1992,1993,1994,1995,1996,1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026];
        const values = [0.025124,0.025953,0.02681,0.027694,0.028608,0.029552,0.030528,0.031535,0.032576,0.033651,0.034761,0.035908,0.037334,0.038816,0.040253,0.041576,0.042757,0.044838,0.045734,0.046649,0.048049,0.049449,0.050971,0.052602,0.054315,0.05609,0.057927,0.059835,0.061809,0.063845,0.065939,0.068087,0.070291,0.072553,0.074877,0.077267,0.079801,0.082417,0.08512,0.087911,0.090794,0.093751,0.096801,0.099948,0.103197,0.106552,0.11002];
        if (!values.every(value => value === null)) {
            const maxValue = Math.max(...values.filter(value => value !== null));
            const displayUnit = maxValue < 0.001
                ? { factor: 1000000, suffix: "K", title: "Thousands", tooltip: "thousand" }
                : maxValue < 1
                    ? { factor: 1000, suffix: "M", title: "Millions", tooltip: "million" }
                    : { factor: 1, suffix: "B", title: "Billions", tooltip: "billion" };
            const displayValues = values.map(value => value === null ? null : value * displayUnit.factor);
            const formatMagnitude = value => new Intl.NumberFormat("en-US", { maximumSignificantDigits: 3 }).format(value);
            const formatAxis = value => formatMagnitude(value) + displayUnit.suffix;
            document.title = document.title.replace("(Billions)", "(" + displayUnit.title + ")");
            document.querySelector("h2").textContent = document.querySelector("h2").textContent.replace("(Billions)", "(" + displayUnit.title + ")");
            new Chart(document.getElementById('populationChart'), {
                type: 'line',
                data: { labels: years, datasets: [{
                    label: "Population", data: displayValues, borderColor: "#2052c5",
                    backgroundColor: 'transparent', borderWidth: 3, pointRadius: 0, pointHoverRadius: 6, tension: 0.3
                }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.9)', padding: 12, callbacks: { label: context => " " + "Democratic Republic of the Congo" + " Population: " + formatMagnitude(context.parsed.y) + " " + displayUnit.tooltip } }
                    },
                    scales: {
                        y: { ticks: { callback: value => formatAxis(value) }, grid: { color: '#f1f5f9' } },
                        x: { grid: { display: false }, ticks: { maxRotation: 45, minRotation: 45 } }
                    }
                }
            });
        } else {
            const canvas = document.getElementById('populationChart');
            const empty = document.createElement('p');
            empty.textContent = 'No IMF data is available for this country and indicator.';
            empty.style.cssText = 'color: #64748b; font-size: 16px; padding: 80px 20px; text-align: center;';
            canvas.replaceWith(empty);
        }
    </script>
</body>
</html>
