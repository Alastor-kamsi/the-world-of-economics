<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigeria GDP</title>
</head>

<body style="background-color: #f8fafc; font-family: -apple-system, sans-serif; padding: 20px; margin: 0;">

    <div style="
        max-width: 800px;
        margin: 40px auto;
        background: #ffffff;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    ">

        <h2 style="
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 20px;
        ">
            Nigeria: Nominal GDP (Billion USD)
        </h2>

        <div style="height: 400px;">
            <canvas id="nigeriaGDPChart"></canvas>
        </div>

        <div id="return-home-button" style="display: flex; justify-content: center; margin-top: 28px;">
            <a class="return-home-button" href="index.html" 
            style="display: inline-block; padding: 12px 26px; border-radius: 999px; background: #0f766e; color: #ffffff; text-decoration: none; font-weight: 600; letter-spacing: 0.01em; box-shadow: 0 5px 12px rgba(15, 118, 110, 0.24); transition: background-color 0.2s ease, transform 0.2s ease;" onmouseover="this.style.backgroundColor='#115e59'; this.style.transform='translateY(-1px)'" onmouseout="this.style.backgroundColor='#0f766e'; this.style.transform='translateY(0)'">Return to Home</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>

        // Nigeria gained independence on 1 October 1960,
        // so the chart starts from 1960.

        const years = [
            1960, 1961, 1962, 1963, 1964, 1965, 1966, 1967, 1968, 1969,
            1970, 1971, 1972, 1973, 1974, 1975, 1976, 1977, 1978, 1979,
            1980, 1981, 1982, 1983, 1984, 1985, 1986, 1987, 1988, 1989,
            1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999,
            2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
            2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019,
            2020, 2021, 2022, 2023, 2024, 2025, 2026
        ];

        const nigeriaGdpBillionsUSD = [
            // 1960s
            4.20, 4.47, 4.92, 5.20, 5.60, 5.87, 6.36, 5.20, 5.20, 6.60,

            // 1970s
            12.10, 14.00, 17.20, 22.80, 26.20, 29.70, 36.60, 42.90, 49.50, 66.80,

            // 1980s
            64.20, 60.90, 72.90, 82.70, 83.80, 75.70, 74.20, 79.50, 89.50, 92.50,

            // 1990s
            54.60, 50.00, 58.60, 28.50, 32.80, 40.50, 46.40, 40.20, 44.50, 47.90,

            // 2000s
            69.45, 74.03, 95.34, 104.91, 136.38, 176.13, 236.10, 275.62, 337.03, 295.45,

            // 2010s
            361.46, 404.99, 455.50, 508.69, 546.68, 493.03, 404.65, 374.95, 421.74, 474.52,

            // 2020s
            432.16, 440.83, 472.62, 487.39, 252.26, 290.79, 377.37
        ];

        new Chart(document.getElementById('nigeriaGDPChart'), {

            type: 'line',

            data: {
                labels: years,

                datasets: [{
                    label: 'Nigeria GDP',
                    data: nigeriaGdpBillionsUSD,

                    // Nigeria-inspired emerald green
                    borderColor: '#059669',
                    backgroundColor: 'transparent',

                    borderWidth: 3,

                    // Clean line with no permanent data points
                    pointRadius: 0,
                    pointHoverRadius: 6,

                    tension: 0.3
                }]
            },

            options: {

                responsive: true,
                maintainAspectRatio: false,

                interaction: {
                    mode: 'index',
                    intersect: false
                },

                plugins: {

                    legend: {
                        display: false
                    },

                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.9)',
                        padding: 12,

                        callbacks: {
                            label: function (context) {
                                return ' GDP: $' +
                                    context.parsed.y.toFixed(2) +
                                    ' billion';
                            }
                        }
                    }
                },

                scales: {

                    y: {
                        min: 0,
                        max: 600,

                        ticks: {
                            callback: function (value) {
                                return '$' + value + 'B';
                            }
                        },

                        grid: {
                            color: '#f1f5f9'
                        }
                    },

                    x: {

                        grid: {
                            display: false
                        },

                        ticks: {
                            maxRotation: 45,
                            minRotation: 45
                        }
                    }
                }
            }
        });

    </script>

</body>

</html>
