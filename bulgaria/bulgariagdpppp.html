<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulgaria GDP PPP (Trillion International Dollars)</title>
</head>
<body style="background-color: #f8fafc; font-family: -apple-system, sans-serif; padding: 20px; margin: 0;">
    <div style="max-width: 800px; margin: 40px auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
        <h2 style="color: #0f172a; margin-top: 0; margin-bottom: 20px;">Bulgaria: GDP PPP (Trillion International Dollars) (1980-2026)</h2>
        <div style="height: 400px;"><canvas id="pppChart"></canvas></div>
        <div id="return-home-button" style="display: flex; justify-content: center; margin-top: 28px;">
            <a class="return-home-button" href="../bulgaria.html" style="display: inline-block; padding: 12px 26px; border-radius: 999px; background: #0f766e; color: #ffffff; text-decoration: none; font-weight: 600; letter-spacing: 0.01em; box-shadow: 0 5px 12px rgba(15, 118, 110, 0.24); transition: background-color 0.2s ease, transform 0.2s ease;" onmouseover="this.style.backgroundColor='#115e59'; this.style.transform='translateY(-1px)'" onmouseout="this.style.backgroundColor='#0f766e'; this.style.transform='translateY(0)'">Return to Bulgaria Home</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7"></script>
    <script>
        // Source: IMF World Economic Outlook (October 2026) via IMF DataMapper.
        // Values are shown for 1980-2026; missing observations remain blank.
        const years = [1980,1981,1982,1983,1984,1985,1986,1987,1988,1989,1990,1991,1992,1993,1994,1995,1996,1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026];
        const values = [0.044707,0.05153,0.057012,0.061022,0.066133,0.069452,0.074606,0.080048,0.08486,0.087746,0.082747,0.076345,0.071505,0.06469,0.06365,0.063944,0.068504,0.059849,0.062815,0.058355,0.062415,0.06626,0.071241,0.076452,0.083619,0.092327,0.101648,0.11135,0.120451,0.117138,0.120405,0.125458,0.128751,0.130232,0.133758,0.139586,0.145177,0.151835,0.161044,0.177101,0.179174,0.20306,0.226446,0.238887,0.253304,0.268022,0.284116];
        if (!values.every(value => value === null)) {
            const maxValue = Math.max(...values.filter(value => value !== null));
            const displayUnit = maxValue < 0.001
                ? { factor: 1000000, suffix: "M", title: "Million International Dollars", tooltip: "million international dollars" }
                : maxValue < 1
                    ? { factor: 1000, suffix: "B", title: "Billion International Dollars", tooltip: "billion international dollars" }
                    : { factor: 1, suffix: "T", title: "Trillion International Dollars", tooltip: "trillion international dollars" };
            const displayValues = values.map(value => value === null ? null : value * displayUnit.factor);
            const formatMagnitude = value => new Intl.NumberFormat("en-US", { maximumSignificantDigits: 3 }).format(value);
            const formatAxis = value => "$" + formatMagnitude(value) + displayUnit.suffix;
            document.title = document.title.replace("(Trillion International Dollars)", "(" + displayUnit.title + ")");
            document.querySelector("h2").textContent = document.querySelector("h2").textContent.replace("(Trillion International Dollars)", "(" + displayUnit.title + ")");
            new Chart(document.getElementById('pppChart'), {
                type: 'line',
                data: { labels: years, datasets: [{
                    label: "GDP PPP", data: displayValues, borderColor: "#20c549",
                    backgroundColor: 'transparent', borderWidth: 3, pointRadius: 0, pointHoverRadius: 6, tension: 0.3
                }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.9)', padding: 12, callbacks: { label: context => " " + "Bulgaria" + " GDP PPP: $" + formatMagnitude(context.parsed.y) + " " + displayUnit.tooltip } }
                    },
                    scales: {
                        y: { ticks: { callback: value => formatAxis(value) }, grid: { color: '#f1f5f9' } },
                        x: { grid: { display: false }, ticks: { maxRotation: 45, minRotation: 45 } }
                    }
                }
            });
        } else {
            const canvas = document.getElementById('pppChart');
            const empty = document.createElement('p');
            empty.textContent = 'No IMF data is available for this country and indicator.';
            empty.style.cssText = 'color: #64748b; font-size: 16px; padding: 80px 20px; text-align: center;';
            canvas.replaceWith(empty);
        }
    </script>
</body>
</html>
